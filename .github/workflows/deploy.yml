name: Deploy to WordPress.org

on:
  push:
    tags:
      - "v*"          # triggers on v1.0.0, v1.1.0 etc.
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & deploy to WP.org SVN
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout full history (needed for changelog diffs) ──────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node for @wordpress/scripts build ───────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install dependencies and build ─────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build
        # This compiles src/ → build/ using @wordpress/scripts.
        # The build/ directory is gitignored but will exist here
        # before the SVN deploy step runs.

      # ── 4. Deploy to WordPress.org plugin SVN ─────────────────────────
      # Docs: https://github.com/10up/action-wordpress-plugin-deploy
      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: idara-reading-time   # must match WP.org plugin slug exactly
        with:
          # Assets (banner, icon, screenshots) live in .wordpress-org/
          # and get pushed to the SVN /assets/ directory separately.
          generate-zip: false        # WP.org generates the zip — we don't
          dry-run: false
